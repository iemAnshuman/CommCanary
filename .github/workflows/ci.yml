name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            gate-args: ""
          - os: ubuntu-latest
            python-version: "3.10"
            gate-args: ""
          - os: ubuntu-latest
            python-version: "3.11"
            gate-args: ""
          - os: ubuntu-latest
            python-version: "3.12"
            gate-args: --reproducible
          - os: ubuntu-latest
            python-version: "3.13"
            gate-args: ""
          - os: macos-latest
            python-version: "3.12"
            gate-args: ""
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and canonical gate dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run canonical verification gate
        run: python -m tools.verify ${{ matrix.gate-args }}

  gloo-conformance:
    name: Four-process Gloo correctness conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned CPU Torch
        run: |
          python -m pip install --disable-pip-version-check ".[dev]"
          python -m pip install --disable-pip-version-check "https://download-r2.pytorch.org/whl/cpu/torch-2.4.1%2Bcpu-cp312-cp312-linux_x86_64.whl#sha256=8800deef0026011d502c0c256cc4b67d002347f63c3a38cd8e45f1f445c61364"
      - name: Require the pinned Gloo build
        run: python -c "import torch; assert torch.__version__ == '2.4.1+cpu'; assert torch.distributed.is_available(); assert torch.distributed.is_gloo_available()"
      - name: Run four-process correctness conformance
        env:
          COMMCANARY_REQUIRE_GLOO: "1"
        run: python -m pytest -q tests/execution/test_gloo_correctness_conformance.py
