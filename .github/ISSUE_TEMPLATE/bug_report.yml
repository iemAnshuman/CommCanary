name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the repository's private vulnerability-reporting flow.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest command, input, or code sample that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CommCanary version
      description: Paste the output of `commcanary --version`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the output of `commcanary doctor`. Remove credentials and private identifiers before submitting.
      render: shell
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add logs, tracebacks, or other details that may help isolate the problem.

